<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>入职登记</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #13141a;
      color: #f1f5f9;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.09);
      overflow: hidden;
    }
    .titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .titlebar h1 { font-size: 13px; font-weight: 600; color: #f8fafc; letter-spacing: 0.2px; }
    .close-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      color: #94a3b8;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .close-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .content {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .photo-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .photo-box {
      width: 64px;
      height: 64px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-ctrl { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .photo-title { font-size: 12px; font-weight: 600; color: #e2e8f0; }
    .photo-btns { display: flex; gap: 8px; }
    .btn-photo, .btn-upload {
      flex: 1;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-photo { border-color: rgba(163,230,53,0.4); color: #ecfccb; background: rgba(163,230,53,0.12); }
    .btn-photo:hover { background: rgba(163,230,53,0.22); }
    .btn-upload:hover { background: rgba(255,255,255,0.12); }

    .form-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .lbl { width: 58px; font-size: 12px; color: #cbd5e1; flex-shrink: 0; }
    input[type="text"] {
      flex: 1; min-width: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 12px;
      color: #f8fafc;
      outline: none;
      user-select: text;
    }
    input[type="text"]::placeholder { color: #64748b; font-size: 11px; }
    input[type="text"]:focus { border-color: #a3e635; background: rgba(255,255,255,0.08); }

    .blood-wrap { flex: 1; display: flex; align-items: center; gap: 5px; }
    .blood-pill {
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .blood-pill:hover { background: rgba(255,255,255,0.12); }
    .blood-pill.active { background: rgba(163, 230, 53, 0.2); border-color: #a3e635; color: #ecfccb; font-weight: 600; }

    .footer {
      padding: 11px 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-skip {
      padding: 7px 14px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: #cbd5e1; font-size: 12px; cursor: pointer;
    }
    .btn-skip:hover { background: rgba(255,255,255,0.11); color: #fff; }
    .btn-submit {
      flex: 1;
      padding: 7px 14px; border-radius: 7px;
      border: none;
      background: #84cc16;
      color: #0f172a; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-submit:hover { background: #a3e635; }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1>入职登记</h1>
    <button class="close-btn" id="btn-close">✕</button>
  </div>

  <div class="content">
    <div class="photo-strip">
      <div class="photo-box" id="photo-box">
        <svg viewBox="0 0 80 80" width="56" height="56">
          <circle cx="40" cy="44" r="24" fill="#18181b"/>
          <polygon points="18,30 22,12 34,24" fill="#18181b"/>
          <polygon points="62,30 58,12 46,24" fill="#18181b"/>
          <ellipse cx="32" cy="44" rx="5.5" ry="6.5" fill="#a3e635"/>
          <ellipse cx="48" cy="44" rx="5.5" ry="6.5" fill="#a3e635"/>
          <ellipse cx="32" cy="44" rx="2" ry="4.5" fill="#09090b"/>
          <ellipse cx="48" cy="44" rx="2" ry="4.5" fill="#09090b"/>
        </svg>
      </div>
      <div class="photo-ctrl">
        <div class="photo-title">工牌头像</div>
        <div class="photo-btns">
          <button class="btn-photo" id="btn-capture-3d">拍 3D 猫</button>
          <button class="btn-upload" id="btn-pick-local">选照片</button>
        </div>
      </div>
    </div>

    <div class="form-card">
      <div class="row">
        <span class="lbl">铲屎官</span>
        <input type="text" id="owner-name" maxlength="12" placeholder="主人称呼或名字" />
      </div>
      <div class="row">
        <span class="lbl">宠物名称</span>
        <input type="text" id="cat-name" maxlength="12" placeholder="小猫名字" />
      </div>
      <div class="row">
        <span class="lbl">血型</span>
        <div class="blood-wrap">
          <button class="blood-pill" data-blood="A型">A</button>
          <button class="blood-pill" data-blood="B型">B</button>
          <button class="blood-pill" data-blood="AB型">AB</button>
          <input type="text" id="blood-type" maxlength="8" placeholder="自填" />
        </div>
      </div>
      <div class="row">
        <span class="lbl">兴趣爱好</span>
        <input type="text" id="hobbies" maxlength="36" placeholder="例如：钻纸箱、半夜跑酷" />
      </div>
      <div class="row">
        <span class="lbl">猫咪技能</span>
        <input type="text" id="skills" maxlength="36" placeholder="例如：翻跟斗、抓虫子、开门" />
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-skip" id="btn-skip">跳过</button>
    <button class="btn-submit" id="btn-submit">确认入职</button>
  </div>

  <script type="module" src="./onboarding.js"></script>
</body>
</html>
