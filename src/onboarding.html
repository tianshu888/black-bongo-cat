<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <link rel="stylesheet" href="./onboarding.css" />
</head>
<body>
  <div class="titlebar">
    <h1>入职登记</h1>
    <button class="close-btn" id="btn-close">✕</button>
  </div>

  <div class="content">
    <div class="photo-strip">
      <div class="photo-box" id="photo-box">
        <svg viewBox="0 0 80 80" width="56" height="56">
          <circle cx="40" cy="44" r="24" fill="#18181b"/>
          <polygon points="18,30 22,12 34,24" fill="#18181b"/>
          <polygon points="62,30 58,12 46,24" fill="#18181b"/>
          <ellipse cx="32" cy="44" rx="5.5" ry="6.5" fill="#a3e635"/>
          <ellipse cx="48" cy="44" rx="5.5" ry="6.5" fill="#a3e635"/>
          <ellipse cx="32" cy="44" rx="2" ry="4.5" fill="#09090b"/>
          <ellipse cx="48" cy="44" rx="2" ry="4.5" fill="#09090b"/>
        </svg>
      </div>
      <div class="photo-ctrl">
        <div class="photo-title">工牌头像</div>
        <div class="photo-btns">
          <button class="btn-photo" id="btn-capture-3d">拍 3D 猫</button>
          <button class="btn-upload" id="btn-pick-local">选照片</button>
        </div>
      </div>
    </div>

    <div class="form-card">
      <div class="row">
        <span class="lbl">铲屎官</span>
        <input type="text" id="owner-name" maxlength="12" placeholder="主人称呼或名字" />
      </div>
      <div class="row">
        <span class="lbl">宠物名称</span>
        <input type="text" id="cat-name" maxlength="12" placeholder="小猫名字" />
      </div>
      <div class="row">
        <span class="lbl">血型</span>
        <div class="blood-wrap">
          <button class="blood-pill" data-blood="A型">A</button>
          <button class="blood-pill" data-blood="B型">B</button>
          <button class="blood-pill" data-blood="AB型">AB</button>
          <input type="text" id="blood-type" maxlength="8" placeholder="自填" />
        </div>
      </div>
      <div class="row">
        <span class="lbl">兴趣爱好</span>
        <input type="text" id="hobbies" maxlength="36" placeholder="例如：钻纸箱、半夜跑酷" />
      </div>
      <div class="row">
        <span class="lbl">猫咪技能</span>
        <input type="text" id="skills" maxlength="36" placeholder="例如：翻跟斗、抓虫子、开门" />
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-skip" id="btn-skip">跳过</button>
    <button class="btn-submit" id="btn-submit">确认入职</button>
  </div>

  <script type="module" src="./onboarding.js"></script>
</body>
</html>
