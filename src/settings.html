<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>小黑猫桌宠 · 档案商店与设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #13141a;
      color: #f1f5f9;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .titlebar h1 { font-size: 13px; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 6px; }
    .coin-pill {
      background: rgba(250, 204, 21, 0.16);
      color: #fde047;
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 99px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      -webkit-app-region: no-drag;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .close-btn:hover { background: #ef4444; color: #fff; }

    .tabs {
      display: flex;
      background: rgba(255,255,255,0.025);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 4px 10px 0;
      gap: 6px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: #e2e8f0; }
    .tab-btn.active { color: #a3e635; border-bottom-color: #a3e635; }

    .tab-pane { display: none; flex: 1; overflow-y: auto; padding: 12px 14px; flex-direction: column; gap: 11px; }
    .tab-pane.active { display: flex; }
    .tab-pane::-webkit-scrollbar { width: 5px; }
    .tab-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 99px; }

    .section {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sec-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #cbd5e1; }
    .badge {
      background: rgba(163, 230, 53, 0.16);
      color: #a3e635;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    /* Profile & Stat Bars */
    .name-row { display: flex; align-items: center; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .name-label { font-size: 11px; color: #94a3b8; flex-shrink: 0; }
    .name-input {
      flex: 1; min-width: 0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px; padding: 3px 7px; font-size: 11.5px; font-weight: 600; color: #f8fafc;
      outline: none; user-select: text;
    }
    .name-input:focus { border-color: #a3e635; background: rgba(255,255,255,0.09); }
    .exhausted-badge {
      display: none; background: rgba(239, 68, 68, 0.2); color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 99px;
      padding: 2px 7px; font-size: 10px; font-weight: 600; flex-shrink: 0;
    }
    .exhausted-badge.show { display: inline-flex; align-items: center; }
    .career-perk { font-size: 10.5px; color: #7dd3fc; line-height: 1.35; }
    .mini-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.38);
      background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,58,138,0.35));
    }
    .mini-photo {
      width: 50px; height: 50px; border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.06); overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .mini-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mini-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .mini-meta-top { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #fff; }
    .mini-tier { font-size: 9.5px; padding: 1px 5px; border-radius: 99px; border: 1px solid currentColor; flex-shrink: 0; }
    .mini-sub { font-size: 10.5px; color: #cbd5e1; line-height: 1.35; word-break: break-all; white-space: pre-line; }
    .stat-bar-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #cbd5e1; }
    .stat-name { width: 56px; flex-shrink: 0; }
    .bar-bg { flex: 1; height: 7px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.25s ease; }
    .stat-val { width: 32px; text-align: right; font-variant-numeric: tabular-nums; color: #94a3b8; }
    .mini-stats { display: flex; justify-content: space-between; font-size: 10.5px; color: #94a3b8; padding-top: 2px; border-top: 1px solid rgba(255,255,255,0.06); }

    /* Shop Items */
    .item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .item-info { display: flex; flex-direction: column; gap: 2px; }
    .item-title { font-size: 12px; font-weight: 600; color: #f1f5f9; }
    .item-desc { font-size: 10.5px; color: #94a3b8; }
    .item-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .btn-sm {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
    .btn-sm.buy { background: rgba(250, 204, 21, 0.15); border-color: rgba(250, 204, 21, 0.4); color: #fde047; }
    .btn-sm.buy:hover:not(:disabled) { background: rgba(250, 204, 21, 0.28); }
    .btn-sm.use { background: #84cc16; border-color: #84cc16; color: #0f172a; font-weight: 600; }
    .btn-sm.use:hover:not(:disabled) { background: #a3e635; }
    .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }

    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .pill-btn {
      padding: 5px 6px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .pill-btn.active { background: rgba(163, 230, 53, 0.22); border-color: #a3e635; color: #ecfccb; font-weight: 600; }

    /* Appearance Controls */
    input[type="range"] { width: 100%; accent-color: #a3e635; cursor: pointer; }
    .quick-row { display: flex; gap: 6px; }
    .quick-row .pill-btn { flex: 1; }
    .swatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .swatch-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .swatch-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .swatch {
      display: flex; align-items: center; gap: 6px; padding: 6px 7px; border-radius: 7px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; font-size: 11px; color: #e2e8f0; transition: all 0.15s;
    }
    .swatch:hover { background: rgba(255,255,255,0.1); }
    .swatch.active { border-color: #a3e635; background: rgba(163, 230, 53, 0.14); font-weight: 600; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.35); }
    .swatch.compact { justify-content: center; flex-direction: column; gap: 3px; padding: 5px 4px; font-size: 10px; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #cbd5e1; padding: 2px 0; }
    .switch {
      position: relative; width: 34px; height: 18px; background: rgba(255,255,255,0.15);
      border-radius: 99px; cursor: pointer; transition: background 0.2s;
    }
    .switch.on { background: #84cc16; }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; transition: transform 0.2s;
    }
    .switch.on::after { transform: translateX(16px); }

    .toast {
      position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 163, 74, 0.92); color: #fff; padding: 5px 12px;
      border-radius: 99px; font-size: 11px; font-weight: 600; pointer-events: none;
      opacity: 0; transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }

    .footer { padding: 10px 14px; display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); }
    .foot-btn {
      flex: 1; padding: 7px 8px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06); color: #e2e8f0; font-size: 11px; cursor: pointer;
    }
    .foot-btn:hover { background: rgba(255,255,255,0.12); }
    .foot-btn.primary { background: #84cc16; border-color: #84cc16; color: #0f172a; font-weight: 600; }
    .foot-btn.primary:hover { background: #a3e635; }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1><span id="title-cat-name">打工喵</span> · 档案与设置</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="coin-pill" id="coins-display">120 币</span>
      <button class="close-btn" id="btn-close">✕</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="shop">档案与商店</button>
    <button class="tab-btn" data-tab="appearance">外观设置</button>
  </div>

  <!-- TAB 1: PROFILE, SHOP & TOYS -->
  <div class="tab-pane active" id="pane-shop">
    <div class="section">
      <div class="mini-badge" id="mini-badge">
        <div class="mini-photo" id="mini-badge-photo"></div>
        <div class="mini-meta">
          <div class="mini-meta-top">
            <span id="badge-dept-id" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">打工喵</span>
            <span class="mini-tier" id="badge-tier-chip">试用期</span>
          </div>
          <div class="mini-sub" id="badge-owner-line">铲屎官</div>
          <div class="mini-sub" id="badge-traits-line" style="color:#94a3b8;">点右侧补全信息</div>
        </div>
        <button class="btn-sm" id="btn-open-onboarding" style="flex-shrink:0;">改工牌</button>
      </div>
      <div class="name-row">
        <span class="name-label">猫名</span>
        <input class="name-input" id="cat-name-input" type="text" maxlength="10" placeholder="打工喵" />
        <button class="btn-sm" id="btn-save-name">改名</button>
        <span class="exhausted-badge" id="exhausted-badge">回体中</span>
      </div>
      <div class="sec-head">
        <span id="career-title">Lv.1 · 实习打杂喵</span>
        <span class="badge" id="career-xp" style="background:rgba(56,189,248,0.16);color:#38bdf8;">0 / 120 XP</span>
      </div>
      <div class="bar-bg" style="width:100%;height:6px;flex:none;"><div class="bar-fill" id="bar-career" style="width:0%;background:linear-gradient(90deg,#38bdf8,#a855f7)"></div></div>
      <div class="career-perk" id="career-perk">1币/次 · 爆单0% · 耗体100%</div>
      <div class="sec-head" style="padding-top:3px;border-top:1px solid rgba(255,255,255,0.06);">
        <span id="bond-title">亲密 Lv.1 · 初识萌猫</span>
        <span class="badge" id="affection-xp">0 / 25</span>
      </div>
      <div class="stat-bar-row">
        <span class="stat-name">饱食度</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-hunger" style="width:84%;background:#f59e0b"></div></div>
        <span class="stat-val" id="val-hunger">84</span>
      </div>
      <div class="stat-bar-row">
        <span class="stat-name">心情值</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-mood" style="width:86%;background:#f472b6"></div></div>
        <span class="stat-val" id="val-mood">86</span>
      </div>
      <div class="stat-bar-row">
        <span class="stat-name">体力值</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-energy" style="width:92%;background:#38bdf8"></div></div>
        <span class="stat-val" id="val-energy">92</span>
      </div>
      <div class="mini-stats" id="mini-stats">打字 0 · 点击 0 · 撸猫 0 · 抓虫 0</div>
    </div>

    <div class="section">
      <div class="sec-head"><span>小铺</span></div>
      <div id="shop-list" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>

    <div class="section">
      <div class="sec-head"><span>饰品</span></div>
      <div class="quick-grid" id="accessory-list"></div>
    </div>

    <div class="section">
      <div class="sec-head"><span>动作演示</span></div>
      <div class="quick-grid">
        <button class="pill-btn" data-demo="demoLoaf">揣手</button>
        <button class="pill-btn" data-demo="demoGroom">洗脸</button>
        <button class="pill-btn" data-demo="demoStretch">伸懒腰</button>
        <button class="pill-btn" data-demo="demoNap">打盹</button>
        <button class="pill-btn" data-demo="demoZoomies">跑酷</button>
        <button class="pill-btn" data-demo="demoBug">抓飞虫</button>
        <button class="pill-btn" data-demo="demoBox">钻纸箱</button>
        <button class="pill-btn" data-demo="demoSomersault">翻跟斗</button>
      </div>
    </div>
  </div>

  <!-- TAB 2: APPEARANCE & BEHAVIOR SETTINGS -->
  <div class="tab-pane" id="pane-appearance">
    <div class="section">
      <div class="sec-head">
        <span>大小</span>
        <span class="badge" id="scale-label">100%</span>
      </div>
      <input type="range" id="scale-slider" min="50" max="180" step="5" value="100" />
      <div class="quick-row">
        <button class="pill-btn" data-scale="0.75">75%</button>
        <button class="pill-btn" data-scale="1">100%</button>
        <button class="pill-btn" data-scale="1.35">135%</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>键盘</span></div>
      <div class="swatch-grid" id="kb-themes">
        <button class="swatch" data-val="classic"><span class="dot" style="background:linear-gradient(135deg,#fff 55%,#f59e0b 55%)"></span>经典</button>
        <button class="swatch" data-val="sakura"><span class="dot" style="background:linear-gradient(135deg,#fce7f3 55%,#f472b6 55%)"></span>樱粉</button>
        <button class="swatch" data-val="candyPink"><span class="dot" style="background:linear-gradient(135deg,#f9a8d4 55%,#db2777 55%)"></span>草莓</button>
        <button class="swatch" data-val="mint"><span class="dot" style="background:linear-gradient(135deg,#ecfdf5 55%,#34d399 55%)"></span>薄荷</button>
        <button class="swatch" data-val="lavender"><span class="dot" style="background:linear-gradient(135deg,#f3e8ff 55%,#a855f7 55%)"></span>香芋</button>
        <button class="swatch" data-val="obsidian"><span class="dot" style="background:linear-gradient(135deg,#27272a 55%,#84cc16 55%)"></span>酷黑</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>鼠标</span></div>
      <div class="swatch-grid cols-4" id="mouse-colors">
        <button class="swatch compact" data-val="white"><span class="dot" style="background:#ffffff"></span>纯白</button>
        <button class="swatch compact" data-val="pink"><span class="dot" style="background:#f9a8d4"></span>樱粉</button>
        <button class="swatch compact" data-val="mint"><span class="dot" style="background:#a7f3d0"></span>薄荷</button>
        <button class="swatch compact" data-val="black"><span class="dot" style="background:#27272a"></span>酷黑</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>毛色与瞳色</span></div>
      <div class="swatch-grid cols-4" id="cat-coats">
        <button class="swatch compact" data-val="black"><span class="dot" style="background:#111116"></span>黑猫</button>
        <button class="swatch compact" data-val="blue"><span class="dot" style="background:#4b5563"></span>蓝猫</button>
        <button class="swatch compact" data-val="cream"><span class="dot" style="background:#f1f5f9"></span>白猫</button>
        <button class="swatch compact" data-val="orange"><span class="dot" style="background:#ea580c"></span>橘猫</button>
      </div>
      <div class="swatch-grid cols-5" id="eye-colors">
        <button class="swatch compact" data-val="lime"><span class="dot" style="background:#a3e635"></span>绿眸</button>
        <button class="swatch compact" data-val="amber"><span class="dot" style="background:#fbbf24"></span>琥珀</button>
        <button class="swatch compact" data-val="sky"><span class="dot" style="background:#38bdf8"></span>蓝眸</button>
        <button class="swatch compact" data-val="pink"><span class="dot" style="background:#f472b6"></span>粉眸</button>
        <button class="swatch compact" data-val="violet"><span class="dot" style="background:#a78bfa"></span>紫眸</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>交互与显示</span></div>
      <div class="toggle-row"><span>按键浮标</span><div class="switch" data-key="showFloatingKeys"></div></div>
      <div class="toggle-row"><span>金币飘字</span><div class="switch" data-key="showFloatingCoins"></div></div>
      <div class="toggle-row"><span>敲击光效</span><div class="switch" data-key="showImpactGlow"></div></div>
      <div class="toggle-row"><span>免打扰</span><div class="switch" data-key="focusNoDisturb"></div></div>
      <div class="toggle-row"><span>音效</span><div class="switch" data-key="soundEnabled"></div></div>
      <div class="toggle-row"><span>置顶</span><div class="switch" data-key="alwaysOnTop"></div></div>
      <div class="toggle-row"><span>锁定位置</span><div class="switch" data-key="lockPosition"></div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="footer">
    <button class="foot-btn" id="btn-reset-pos">重置位置</button>
    <button class="foot-btn" id="btn-reset-all">恢复默认</button>
    <button class="foot-btn primary" id="btn-done">完成</button>
  </div>

  <script type="module" src="./settings.js"></script>
</body>
</html>
