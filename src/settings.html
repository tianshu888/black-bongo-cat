<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>小黑猫桌宠 · 自定义设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #13141a;
      color: #f1f5f9;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .titlebar h1 {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .close-btn:hover { background: #ef4444; color: #fff; }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 99px; }

    .section {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .badge {
      background: rgba(163, 230, 53, 0.16);
      color: #a3e635;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #a3e635;
      cursor: pointer;
    }
    .quick-row {
      display: flex;
      gap: 6px;
    }
    .pill-btn {
      flex: 1;
      padding: 4px 6px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.12); }
    .pill-btn.active {
      background: rgba(163, 230, 53, 0.22);
      border-color: #a3e635;
      color: #ecfccb;
      font-weight: 600;
    }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .swatch-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }
    .swatch-grid.cols-5 {
      grid-template-columns: repeat(5, 1fr);
    }
    .swatch {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 7px;
      border-radius: 7px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      font-size: 11px;
      color: #e2e8f0;
      transition: all 0.15s;
    }
    .swatch:hover { background: rgba(255,255,255,0.1); }
    .swatch.active {
      border-color: #a3e635;
      background: rgba(163, 230, 53, 0.14);
      font-weight: 600;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.35);
    }
    .swatch.compact {
      justify-content: center;
      flex-direction: column;
      gap: 3px;
      padding: 5px 4px;
      font-size: 10px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
      padding: 2px 0;
    }
    .switch {
      position: relative;
      width: 34px;
      height: 18px;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .switch.on { background: #84cc16; }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    .switch.on::after { transform: translateX(16px); }

    .footer {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }
    .foot-btn {
      flex: 1;
      padding: 7px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      font-size: 11px;
      cursor: pointer;
    }
    .foot-btn:hover { background: rgba(255,255,255,0.12); }
    .foot-btn.primary {
      background: #84cc16;
      border-color: #84cc16;
      color: #0f172a;
      font-weight: 600;
    }
    .foot-btn.primary:hover { background: #a3e635; }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1>🐾 桌宠自定义设置</h1>
    <button class="close-btn" id="btn-close">✕</button>
  </div>

  <div class="content">
    <div class="section">
      <div class="sec-head">
        <span>📏 桌宠整体大小</span>
        <span class="badge" id="scale-label">100%</span>
      </div>
      <input type="range" id="scale-slider" min="50" max="180" step="5" value="100" />
      <div class="quick-row">
        <button class="pill-btn" data-scale="0.75">迷你 75%</button>
        <button class="pill-btn" data-scale="1">标准 100%</button>
        <button class="pill-btn" data-scale="1.35">大号 135%</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>⌨ 键盘配色主题</span></div>
      <div class="swatch-grid" id="kb-themes">
        <button class="swatch" data-val="classic"><span class="dot" style="background:linear-gradient(135deg,#fff 55%,#f59e0b 55%)"></span>经典白橙</button>
        <button class="swatch" data-val="sakura"><span class="dot" style="background:linear-gradient(135deg,#fce7f3 55%,#f472b6 55%)"></span>樱花粉白</button>
        <button class="swatch" data-val="candyPink"><span class="dot" style="background:linear-gradient(135deg,#f9a8d4 55%,#db2777 55%)"></span>草莓甜粉</button>
        <button class="swatch" data-val="mint"><span class="dot" style="background:linear-gradient(135deg,#ecfdf5 55%,#34d399 55%)"></span>薄荷奶油</button>
        <button class="swatch" data-val="lavender"><span class="dot" style="background:linear-gradient(135deg,#f3e8ff 55%,#a855f7 55%)"></span>香芋浅紫</button>
        <button class="swatch" data-val="obsidian"><span class="dot" style="background:linear-gradient(135deg,#27272a 55%,#84cc16 55%)"></span>极客酷黑</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>🖱 鼠标外壳颜色</span></div>
      <div class="swatch-grid cols-4" id="mouse-colors">
        <button class="swatch compact" data-val="white"><span class="dot" style="background:#ffffff"></span>纯白</button>
        <button class="swatch compact" data-val="pink"><span class="dot" style="background:#f9a8d4"></span>樱粉</button>
        <button class="swatch compact" data-val="mint"><span class="dot" style="background:#a7f3d0"></span>薄荷</button>
        <button class="swatch compact" data-val="black"><span class="dot" style="background:#27272a"></span>酷黑</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>🐱 猫咪毛色 & 瞳色</span></div>
      <div class="swatch-grid cols-4" id="cat-coats">
        <button class="swatch compact" data-val="black"><span class="dot" style="background:#111116"></span>小黑猫</button>
        <button class="swatch compact" data-val="blue"><span class="dot" style="background:#4b5563"></span>蓝猫</button>
        <button class="swatch compact" data-val="cream"><span class="dot" style="background:#f1f5f9"></span>小白猫</button>
        <button class="swatch compact" data-val="orange"><span class="dot" style="background:#ea580c"></span>小橘猫</button>
      </div>
      <div class="swatch-grid cols-5" id="eye-colors">
        <button class="swatch compact" data-val="lime"><span class="dot" style="background:#a3e635"></span>绿眸</button>
        <button class="swatch compact" data-val="amber"><span class="dot" style="background:#fbbf24"></span>琥珀</button>
        <button class="swatch compact" data-val="sky"><span class="dot" style="background:#38bdf8"></span>蓝眸</button>
        <button class="swatch compact" data-val="pink"><span class="dot" style="background:#f472b6"></span>粉眸</button>
        <button class="swatch compact" data-val="violet"><span class="dot" style="background:#a78bfa"></span>紫眸</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span>✨ 互动与行为</span></div>
      <div class="toggle-row"><span>打字弹出键帽字符</span><div class="switch" data-key="showFloatingKeys"></div></div>
      <div class="toggle-row"><span>敲击绿光星芒特效</span><div class="switch" data-key="showImpactGlow"></div></div>
      <div class="toggle-row"><span>打字与撸猫音效</span><div class="switch" data-key="soundEnabled"></div></div>
      <div class="toggle-row"><span>窗口永远置顶</span><div class="switch" data-key="alwaysOnTop"></div></div>
      <div class="toggle-row"><span>锁定窗口位置防误拖</span><div class="switch" data-key="lockPosition"></div></div>
    </div>
  </div>

  <div class="footer">
    <button class="foot-btn" id="btn-reset-pos">📍 重置位置</button>
    <button class="foot-btn" id="btn-reset-all">↺ 恢复默认</button>
    <button class="foot-btn primary" id="btn-done">完成</button>
  </div>

  <script src="./settings.js"></script>
</body>
</html>
